spring.application.name=catastro-backend
server.port=8080

# Perfil "dev" usa cuentas DEMO en memoria (correo/dev/CuentasDemo.java)
spring.profiles.active=${PERFIL:dev}

# ===== Base de datos (PostgreSQL + PostGIS, ver docker-compose.yml) =====
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/catastro}
spring.datasource.username=${DB_USUARIO:catastro}
spring.datasource.password=${DB_CONTRASENA:catastro}
# Las tablas se crean con los scripts de sql/, no con Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# ===== Correo (Gmail). Los valores reales van en variables de entorno, NUNCA en el repo =====
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${CORREO_USUARIO:}
# Contraseña de APLICACIÓN de Gmail (16 letras), no la contraseña normal de la cuenta
spring.mail.password=${CORREO_CONTRASENA_APP:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

catastro.correo.remitente=${CORREO_USUARIO:sin-configurar@localhost}
catastro.correo.nombre=Catastro Coatzacoalcos (prototipo)
# Dirección del frontend; los enlaces del correo apuntan ahí (Vite usa el puerto 3000)
catastro.correo.url-web=${URL_WEB:http://localhost:3000}
# En false no envía nada: el correo (con su enlace) se escribe en el log
catastro.correo.habilitado=${CORREO_HABILITADO:false}

# ===== CORS =====
catastro.cors.origenes=${CORS_ORIGENES:http://localhost:3000}
